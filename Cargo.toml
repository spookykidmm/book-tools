[workspace]
members = [
    "book-core",
    "book-scan",
    "book-clean",
    "book-merge",
    "book-meta",
    "book-organize",
    "book-report",
    "book-pretty",
    "book-watch",
]

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
walkdir = "2.4"
rayon = "1.8"
regex = "1.10"
indicatif = "0.17"
clap = { version = "4.4", features = ["derive"] }
log = "0.4"
env_logger = "0.10"
glob = "0.3"
md5 = "0.7"
chrono = "0.4"
notify = "6.1"
uuid = { version = "1.6", features = ["v4"] }
blake3 = "1.5"
lofty = "0.21"
which = "6.0"
tempfile = "3.10"
